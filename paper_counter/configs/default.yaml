# Coordinates refer to the original image; x2/y2 are exclusive.
# roi: {x1: 0, x2: 133, y1: 0, y2: 170}
roi: null
illumination_sigma: 15.0
epsilon: 0.000001
# Negative detects paper bottoms; positive/auto remain explicit options.
gradient_polarity: negative
# More strips permit curvature tracking; 8/12/16 are supported.
num_strips: 12
# tracks: new multi-strip-first engine; legacy: previous global-first engine.
algorithm: tracks
horizontal_margin_ratio: 0.05
profile_smooth_sigma: 1.0
min_period: 5
max_period: 50
min_acf_score: 0.10
# Prefer the shortest local ACF peak reaching 85% of the strongest peak.
acf_harmonic_preference: 0.85
prominence_k: 2.0
distance_ratio: 0.55
vote_tolerance_ratio: 0.20
min_vote_ratio: 0.5
strip_prominence_ratio: 0.6
duplicate_ratio: 0.50
# Reject broad normalization halos; width is measured at half prominence.
max_peak_width_ratio: 0.50
repair_tolerance_ratio: 0.25
weak_prominence_ratio: 0.5
repair_min_vote_ratio: 0.5
repair_gap_error_ratio: 0.30
max_repair_gap_periods: 4
confidence_weights:
  spacing: 0.35
  vote: 0.35
  acf: 0.30
repair_confidence_penalty: 0.7
confidence_min_edges: 8
display_max_height: 4000
display_max_width: 1600
debug_chunk_rows: 1024

# Exact sliding median/MAD window length, measured in initial periods.
local_window_periods: 8.0
# Per-strip strong/weak prominence multipliers; weak alone never seeds a sheet.
strong_prominence_k: 2.0
weak_prominence_k: 0.8
# Global robust scale floor prevents division/amplification in flat windows.
mad_floor_ratio: 0.1
# Bound the temporary sliding-window matrix (float32, rows * window).
local_statistics_chunk_rows: 512
# Maximum displacement per neighboring strip, as fraction of initial period;
# geometry validation still rejects abrupt high-frequency jumps.
max_neighbor_shift_ratio: 0.50
# DP penalties on normalized slope, slope change, and each skipped strip.
track_shift_penalty: 0.25
track_curvature_penalty: 0.15
track_skip_penalty: 0.40
# Permit up to two consecutive missing strips.
max_skip_strips: 2
# Ordinary paths require at least two strong nodes and three observed nodes.
min_strong_support: 2
min_absolute_track_support: 3
# Coverage denominator: valid non-flat strips. Continuity denominator: all strips.
min_track_support_ratio: 0.60
min_continuity_ratio: 0.30
# Independent final score and smoothness gates.
min_track_score: 0.60
# Vertical sequence: keep the strong gate above unchanged. Marginal proposals
# still need gradient, geometry and at least three observed strips.
vertical_sequence_enabled: true
track_proposal_floor: 0.45  # Usable proposal score floor, not final acceptance.
sequence_unary_weight: 1.0  # Weight of existing normalized track score.
sequence_spacing_weight: 0.45  # Soft Huber spacing penalty.
sequence_spacing_change_weight: 0.0  # Optional second-order penalty; off by default.
sequence_spacing_scale_ratio: 0.20  # sigma=max(1px, ratio*d, 1.4826*MAD); n-period gap uses sqrt(n)*sigma.
sequence_min_spacing_ratio: 0.55  # Below this, add the short-gap penalty.
sequence_short_gap_penalty: 2.0  # Graded extra penalty for short gaps.
sequence_missing_period_penalty: 0.45  # Cost per skipped period; never adds a node.
max_sequence_gap_periods: 4  # Bound DAG transitions and evidence searches.
sequence_rescue_bonus: 0.05  # Marginal unary bonus, capped below the strong gate.
sequence_suppress_margin: 0.02  # Per-node cost; require a meaningful improvement.
spacing_anomaly_mad_k: 2.5  # Large/short deviations, not just integer multiples.
recovery_reuse_candidate_radius_ratio: 0.65  # Reuse full candidate within this*d.
recovery_base_search_ratio: 0.20  # Base weak-image curve search half-width / d.
recovery_period_mad_weight: 1.5  # Additional width per pixel of local period MAD.
recovery_track_geometry_weight: 0.5  # Additional width per pixel of neighbor Y MAD.
recovery_min_search_ratio: 0.20  # Lower half-width bound / d.
recovery_max_search_ratio: 0.65  # Upper half-width bound / d.
# Geometry-centric sequence defaults. Period remains a spacing scale only.
sequence_period_multiple_mode: false
# Continuous local regularity drives the hybrid sequence.  The historical
# period-multiple objective remains available above for comparison only.
regularity_enabled: true
regularity_window_tracks: 7
regularity_acf_window_periods: 8.0
regularity_spacing_weight: 0.45
regularity_acf_weight: 0.25
regularity_track_weight: 0.30
regularity_geometry_weight: 0.10
regularity_spacing_mad_scale: 0.12
regularity_gap_min_ratio: 0.55
regularity_gap_max_ratio: 1.55
regularity_track_mad_scale: 0.18
regularity_geometry_mad_scale: 0.18
regularity_acf_min_ratio: 0.60
regularity_acf_max_ratio: 1.45
regularity_regular_threshold: 0.70
regularity_irregular_threshold: 0.40
adaptive_period_reasoning: true
regular_spacing_prior_weight: 0.30
mixed_spacing_prior_weight: 0.12
irregular_spacing_prior_weight: 0.02
regular_large_gap_search_enabled: true
regular_gap_multiple_tolerance: 0.25
regular_recovery_weak_threshold_scale: 0.85
regular_recovery_support_relaxation: 0.85
regular_recovery_search_ratio: 0.35
irregular_gap_search_enabled: false
raw_stack_mask_enabled: true
raw_mask_brightness_k: 4.0
raw_mask_texture_k: 4.0
raw_mask_background_percentile: 20.0
raw_mask_relative_floor: 0.005
raw_mask_close_ratio: 2.0
raw_mask_margin_spacing_ratio: 1.0
raw_mask_min_active_ratio: 0.005
raw_mask_boundary_padding_ratio: 0.10
raw_mask_min_track_evidence_ratio: 0.60
margin_allow_marginal: true
margin_allow_weak_recovery: true
margin_min_gradient_score: 0.40
margin_min_support_ratio: 0.80
margin_min_track_score: 0.60
margin_recovery_negative_support: 0.75
mask_edge_growth_enabled: true
mask_high_confidence_black_k: 4.0
mask_min_black_run: 3
mask_refine_with_strong_tracks: true
mask_refine_max_spacing_ratio: 1.5
pass2_exception_only: true
track_curve_method: piecewise_linear
track_curve_max_interpolation_gap: 3
track_curve_observation_uncertainty: 0.5
track_continuity_geometry_enabled: false
track_max_neighbor_jump_ratio: 0.50
track_geometry_shift_penalty: 0.05
track_geometry_curvature_penalty: 0.08
track_max_neighbor_change_ratio: 0.25
track_unreasonable_change_penalty: 3.0
sequence_non_crossing_weight: 0.10
sequence_gap_geometry_weight: 0.10
sequence_geometry_ambiguity_weight: 0.30
sequence_short_spacing_weight: 3.0
sequence_long_spacing_weight: 0.05
sequence_short_gap_ratio: 0.55
sequence_spacing_prior_weight: 0.03
sequence_large_gap_anomaly_ratio: 1.50
sequence_crossing_hard_reject_ratio: 0.50
sequence_min_shared_strips: 3
sequence_min_geometric_gap: 0.5
sequence_gap_derivative_ratio: 0.50
recovery_require_negative_evidence: true
geometry_confidence_ambiguity_penalty: 0.60
geometry_confidence_ambiguity_exponent: 2.0
min_track_smoothness: 0.45
# Local candidate-prominence reference for track strength, independent of MAD detection.
local_peak_reference_percentile: 75.0
# Significance r maps to r/(1+r): 0.20 requires 0.25x local reference.
min_track_gradient_score: 0.20
min_recovery_gradient_score: 0.10
# Image-evidence weights; no period term in track acceptance score.
track_gradient_weight: 0.35
track_coverage_weight: 0.25
track_continuity_weight: 0.15
track_smoothness_weight: 0.25
# Duplicate paths must be close in center AND overlap in observed strip positions.
duplicate_track_ratio: 0.50
duplicate_position_ratio: 0.25
duplicate_overlap_ratio: 0.50
# Robust local spacing from nearby gaps, then an odd median-filter window.
local_period_neighbors: 7
local_period_smooth_window: 5
# Reject small duplicate-like and large missing-like gaps from local estimation.
local_period_gap_min_ratio: 0.60
local_period_gap_max_ratio: 1.50
# Maximum distance from an integer gap/period before launching recovery.
missing_gap_tolerance: 0.25
# Per-strip search halfwidth around interpolated neighboring curves / local period.
recovery_search_ratio: 0.25
# Recovered paths still require multiple observed, continuous, smooth strip peaks.
min_recovery_support_ratio: 0.60
min_recovery_continuity_ratio: 0.30
min_recovery_track_score: 0.55
# Positive evidence gives a small bounded score bonus; cannot waive structural gates.
positive_aux_weight: 0.05
positive_aux_search_ratio: 0.50
# Auto active ROI uses raw-gradient row energy, preserving partial endpoint sheets.
auto_stack_roi: true
stack_energy_smooth_periods: 1.0
stack_roi_margin_ratio: 1.0
# Threshold relative to a robust positive-energy percentile, not max reflection.
stack_energy_threshold_ratio: 0.08
stack_energy_percentile: 75.0
# Sustained extent and allowed internal gap before selecting main texture region.
stack_min_extent_periods: 2.0
stack_gap_close_periods: 2.0
# Track consistency score (not a calibrated probability).
track_confidence_weights:
  track: 0.30
  support: 0.20
  continuity: 0.15
  smoothness: 0.15
  spacing: 0.20
# Additional penalty for unexplained local spacing; repairs use existing penalty.
suspicious_gap_penalty: 0.50

# Final image-boundary identity verifier. It runs after every recovery stage.
# Shadow mode proposes decisions but preserves the detector count.
final_track_verifier_enabled: true
final_track_verifier_shadow_mode: true
identity_profile_samples: 81
identity_profile_extent_ratio: 0.60
identity_template_min_tracks: 5
identity_template_trim_mad_k: 4.0
identity_template_distance_floor: 0.15
identity_similarity_mad_floor: 0.04
identity_reference_min_support: 0.80
identity_reference_min_score: 0.70
identity_insufficient_template_weight_scale: 0.20
identity_positive_pair_min_response: 1.0
identity_positive_pair_reference: 4.0
identity_near_boundary_ratio: 1.0
identity_low_paper_support: 0.35
identity_low_positive_pair_score: 0.10
identity_suspicious_outlier_z: 3.0
identity_reject_outlier_z: 4.0
identity_low_template_similarity: 0.45
identity_low_strip_consistency: 0.25
identity_low_negative_isolation: 0.25
identity_min_reject_evidence_families: 2
identity_score_mad_floor: 0.04
identity_ambiguous_z: 3.0
identity_score_weights:
  template: 0.30
  negative: 0.15
  above: 0.20
  positive: 0.10
  consistency: 0.15
  context: 0.10
