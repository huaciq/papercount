# Positive-gradient main detector: one observed rising edge per paper.
# Matches multiscale_only.yaml except for the primary polarity.
gradient_polarity: positive
algorithm: tracks
final_track_verifier_enabled: true
final_track_verifier_shadow_mode: false
multiscale_gradient_enabled: true
enhanced_period_from_native: true
gradient_scales: [0.0, 0.7, 1.4]
multiscale_raw_support_ratio: 0.10
multiscale_raw_support_radius: 2
recovery_require_primary_evidence: true
