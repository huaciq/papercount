# Evaluation configuration for conservative geometry and broad-edge recovery.
gradient_polarity: negative
algorithm: tracks
final_track_verifier_enabled: true
final_track_verifier_shadow_mode: false

# A slanted edge is broadened by projection inside each strip.  The previous
# 0.50 cutoff rejected confirmed paper edges whose measured width was
# 0.51-0.64 of the local paper spacing.
max_peak_width_ratio: 0.65
