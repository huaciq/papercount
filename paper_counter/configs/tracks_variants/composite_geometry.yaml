# Explicit trial: automatic stack deskew and sampling before the unchanged detector.
profile: paper_layers_v4
input:
  roi: null
  gradient_polarity: positive
  auto_geometry_enabled: true
  geometry_target_spacing: 14.0
signal:
  num_strips: 12
  min_period: 5
  max_period: 50
  illumination_sigma: 15.0
association:
  orientation_window_rows: 96
  orientation_max_slope: 0.6
decision:
  final_track_verifier_enabled: true
  composite_layers_enabled: true
display:
  display_max_height: 4000
  display_max_width: 1600
